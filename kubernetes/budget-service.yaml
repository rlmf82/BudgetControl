apiVersion: v1
kind: Service
metadata:
    name: budget-service
    labels:
      app: budget-ws
      tier: backend
spec:
  type: NodePort
  selector:
    app: budget-ws
  ports:
    - port: 9000
      protocol: TCP
      targetPort: 9000

# to expose a service, run kubectl apply -f budget-service.yaml
# to test connectivity, run kubectl run test-client --image=busybox:1.37 --restart=Never -it -- sh
# then, execute a wget -q0- http://budget-service:9000/<endpoint>
