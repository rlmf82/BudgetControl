spring.application.name=BudgetControl
server.port=9000

# Datasource (PostgreSQL) - create the schema below yourself; Liquibase creates the tables.
# DB_HOST/DB_PORT default to plain local dev; override them to reach postgres from another container.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/budgetcontrol
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# Schema is owned by Liquibase; Hibernate must only validate it, never generate/alter it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.h2.console.enabled=false

spring.config.import=configtree:/opt/secrets/db/
