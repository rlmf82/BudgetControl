spring.application.name=BudgetControl
server.port=8082

# Datasource (MySQL) - create the schema below yourself; Liquibase creates the tables.
spring.datasource.url=jdbc:mysql://localhost:3306/budgetcontrol?serverTimezone=Europe/Lisbon
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Schema is owned by Liquibase; Hibernate must only validate it, never generate/alter it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.h2.console.enabled=false
